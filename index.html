  <div id="error-display" style="display:none; padding:20px; color:#991b1b; background:#fee2e2; border:1px solid #f87171; margin:20px; font-family:sans-serif; border-radius:8px; z-index:99999; position:relative;">

    <pre id="error-message" style="white-space:pre-wrap; word-break:break-all; font-size:13px;"></pre>
  </div>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var display = document.getElementById('error-display');
      var msgElem = document.getElementById('error-message');
      if (display && msgElem) {
        display.style.display = 'block';
        msgElem.textContent = 'Lỗi JavaScript: ' + msg + '\nFile: ' + url + ' (Dòng: ' + lineNo + ', Cột: ' + columnNo + ')\n' + (error && error.stack ? error.stack : '');
      }
      return false;
    };

      for (const prov of OLD_REGIONS) {
        const foundDist = prov.districts.find(d => d.name === huyenName);
        if (foundDist) {
          return { province: prov.province, communes: foundDist.communes || [] };
        }
      }
      return { province: '', communes: [] };

    // CSV Parsers
    const parseCSVLine = (text) => {
      const rows = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"' && text[i+1] === '"') { current += '"'; i++; }
        else if (char === '"') { inQuotes = !inQuotes; }
        else if (char === '\n' && !inQuotes) { rows.push(current); current = ''; }
        else { current += char; }
      }
      if (current) rows.push(current);
      return rows;
    };

    const parseCSVColumns = (row, separator) => {
      const cols = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        let char = row[i];
        if (char === '"' && row[i+1] === '"') { current += '"'; i++; }
        else if (char === '"') { inQuotes = !inQuotes; }
        else if (char === separator && !inQuotes) { cols.push(current.trim()); current = ''; }
        else { current += char; }
      }
      cols.push(current.trim());
      return cols;
    };

          try {
            let rawData = event.target.result;
            if (rawData.charCodeAt(0) === 0xFEFF) rawData = rawData.slice(1);
            const jsonData = JSON.parse(rawData);
            if (!jsonData || typeof jsonData !== 'object') return showNotification('Lỗi: File dữ liệu không hợp lệ!');

            let importedCount = 0;

            if (jsonData.adminPassword) {
              setAdminPassword(jsonData.adminPassword);
              setStorageItem('gialai_admin_pass', jsonData.adminPassword);
            }

            if (jsonData.qhChung || jsonData.data || jsonData.records) {
              const list = jsonData.qhChung || jsonData.data || jsonData.records;

                setData(list);

            if (jsonData.qhChiTiet || jsonData.detailData) {

                          <ul className="list-disc pl-8 space-y-2">
                            <li>Tổng số đơn vị quy hoạch đang theo dõi: <b>{reportModal.type === 'CHUNG' ? statsOverview.total : (detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.total, 0)}</b> đơn vị.</li>
                            <li>Số lượng đã được phê duyệt chính thức: <b>{reportModal.type === 'CHUNG' ? statsOverview.approved : (detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.approved, 0)}</b> đơn vị.</li>
                            <li>Tỷ lệ hoàn thành: <b>{reportModal.type === 'CHUNG' ? statsOverview.approvedPercent + '%' : (((detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.approved, 0) / Math.max(1, (detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.total, 0))) * 100).toFixed(1) + '%'}</b>.</li>
                          </ul>
                          <p className="font-bold font-sans mt-6">2. Nhiệm vụ và giải pháp trọng tâm:</p>
                          <p>Tập trung đôn đốc các địa phương đẩy nhanh tiến độ thẩm định, trình duyệt đồ án đối với các khu vực chưa hoàn thành; đảm bảo đồng bộ với định hướng sáp nhập đơn vị hành chính theo Nghị quyết số 1664/NQ-UBTVQH15.</p>
                        </div>
                        <div className="flex justify-between mt-12 pt-6 font-sans text-xs">
                          <div><p className="font-bold">Nơi nhận:</p><p>- Như trên;</p><p>- Lưu: VT, QLĐT.</p></div>
                          <div className="text-center"><p className="font-bold uppercase">GIÁM ĐỐC</p><p className="italic text-slate-400 mt-8">(Ký, đóng dấu)</p></div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CONFIRM DIALOG */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[999999]">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"><AlertTriangle className="w-8 h-8" /></div>
                <h3 className="font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                <p className="text-slate-600 text-sm mb-6">{confirmDialog.message}</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={closeConfirm} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">Hủy</button>
                  <button onClick={confirmDialog.onConfirm} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">Xác nhận</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
